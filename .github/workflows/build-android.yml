name: GENIUS APP AI - Android APK Builder

on:
  workflow_dispatch:
    inputs:
      project_zip_url:
        description: "HTTPS URL du projet Android ZIP"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Prepare Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -e
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate and download project
        env:
          PROJECT_ZIP_URL: ${{ inputs.project_zip_url }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          url = os.environ["PROJECT_ZIP_URL"]
          parsed = urlparse(url)

          if parsed.scheme != "https" or not parsed.hostname:
              raise SystemExit(
                  "Erreur : une URL HTTPS valide est obligatoire."
              )

          if parsed.username or parsed.password:
              raise SystemExit(
                  "Erreur : les identifiants dans l'URL sont interdits."
              )
          PY

          mkdir -p project
          curl --fail --location --silent --show-error \
            --max-time 120 \
            "$PROJECT_ZIP_URL" \
            --output project.zip

          python3 - <<'PY'
          import zipfile

          with zipfile.ZipFile("project.zip") as archive:
              for item in archive.infolist():
                  name = item.filename.replace("\\", "/")
                  if name.startswith("/") or ".." in name.split("/"):
                      raise SystemExit(
                          "Erreur : chemin dangereux dans le ZIP."
                      )
              archive.extractall("project")
          PY

          rm project.zip

      - name: Find Android project
        id: locate
        run: |
          set -euo pipefail

          SETTINGS=$(find project -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "Erreur : fichier settings.gradle introuvable."
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")
          echo "project_root=$ROOT" >> "$GITHUB_OUTPUT"

          if [ -f "$ROOT/gradlew" ]; then
            chmod +x "$ROOT/gradlew"
            echo "use_wrapper=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_wrapper=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compile Android APK
        working-directory: ${{ steps.locate.outputs.project_root }}
        env:
          USE_WRAPPER: ${{ steps.locate.outputs.use_wrapper }}
        run: |
          set -euo pipefail

          if [ "$USE_WRAPPER" = "true" ]; then
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Find generated APK
        id: apk
        working-directory: ${{ steps.locate.outputs.project_root }}
        run: |
          set -euo pipefail

          APK=$(find . -type f \
            -path "*/build/outputs/apk/*/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "Erreur : aucun APK n'a été généré."
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: GENIUS-APP-ANDROID-APK
          path: ${{ steps.locate.outputs.project_root }}/${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7
